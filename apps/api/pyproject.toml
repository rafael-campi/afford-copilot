[project]
name = "afford-api"
version = "0.1.0"
description = "HTTP API: accounts, consent, masking, audit and conversations."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "itsdangerous>=2.2", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "argon2-cffi>=23.1", "email-validator>=2.2", "python-multipart>=0.0.12", "afford-extrato", "afford-seed", "afford-simulador", "afford-mercado", "afford-agentes", "afford-rag"]

[tool.uv.sources]
afford-extrato = { workspace = true }
afford-seed = { workspace = true }
afford-simulador = { workspace = true }
afford-mercado = { workspace = true }
afford-agentes = { workspace = true }
afford-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
