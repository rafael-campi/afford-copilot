name: afford

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: afford
      POSTGRES_PASSWORD: afford
      POSTGRES_DB: afford
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afford -d afford"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://afford:afford@db:5432/afford
      AFFORD_MERCADO_DIR: /app/data/mercado/snapshots
      AFFORD_FOCUS_DIR: /app/data/mercado/focus
      AFFORD_RAG_DIR: /app/data/rag/documentos
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
