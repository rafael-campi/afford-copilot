[project]
name = "afford-seed"
version = "0.1.0"
description = "Seeded generator of synthetic Personas and their Extratos."
requires-python = ">=3.12"
dependencies = ["afford-extrato"]

[tool.uv.sources]
afford-extrato = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "seed"
