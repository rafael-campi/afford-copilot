[project]
name = "afford"
version = "0.1.0"
description = "Independent AI copilot for big purchase decisions."
requires-python = ">=3.12"
dependencies = [
  "afford-api",
  "afford-simulador",
  "afford-mercado",
  "afford-extrato",
  "afford-rag",
  "afford-agentes",
  "afford-seed",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[tool.uv.sources]
afford-api = { workspace = true }
afford-simulador = { workspace = true }
afford-mercado = { workspace = true }
afford-extrato = { workspace = true }
afford-rag = { workspace = true }
afford-agentes = { workspace = true }
afford-seed = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["api", "simulador", "mercado", "extrato", "rag", "agentes", "seed"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/api/tests", "evals", "apps/api/src", "packages/simulador/src", "packages/mercado/src", "packages/extrato/src", "packages/rag/src", "packages/agentes/src", "packages/seed/src"]
explicit_package_bases = true
files = ["apps/api/src", "apps/api/tests", "packages", "evals"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages", "evals"]
addopts = "--import-mode=importlib"
pythonpath = ["apps/api/tests", "evals"]
